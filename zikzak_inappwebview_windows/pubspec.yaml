name: zikzak_inappwebview_windows
description: The Windows implementation of zikzak_inappwebview.
version: 6.3.4
homepage: https://github.com/arrrrny/zikzak_inappwebview

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

flutter:
  plugin:
    implements: zikzak_inappwebview
    platforms:
      windows:
        dartPluginClass: ZikzakInAppWebViewWindows
        fileName: zikzak_inappwebview_windows.dart

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.9.0
  zikzak_inappwebview_platform_interface: ^6.3.4
  zikzak_webview_windows: ^0.5.0
  path: ^1.9.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # Dev-mode resolution of the renamed companion package: the controller
  # compiles against the WebView2 DevTools protocol API
  # (callDevToolsProtocolMethod / devToolsProtocolEvent / listener add+remove),
  # which lives in zikzak_webview_windows (the BSD-3 fork of webview_windows,
  # carrying jnschulze/flutter-webview-windows#334). Until 0.5.0 is published to
  # pub.dev this path override is the only way to resolve it; keep it in dev
  # setup and drop it (or leave it, as with the sibling packages) before
  # publishing — scripts/prepare_for_publish.sh strips this whole section.
  zikzak_webview_windows:
    path: ../zikzak_webview_windows

