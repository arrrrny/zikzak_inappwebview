name: zikzak_inappwebview_windows
description: The Windows implementation of zikzak_inappwebview.
version: 6.4.1
homepage: https://github.com/arrrrny/zikzak_inappwebview

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

flutter:
  plugin:
    implements: zikzak_inappwebview
    platforms:
      windows:
        dartPluginClass: ZikzakInAppWebViewWindows
        fileName: zikzak_inappwebview_windows.dart

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.9.0
  zikzak_inappwebview_platform_interface: ^6.4.1
  zikzak_webview_windows: ^0.5.0
  path: ^1.9.0
  path_provider: ^2.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

