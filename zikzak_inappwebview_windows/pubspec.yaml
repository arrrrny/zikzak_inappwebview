name: zikzak_inappwebview_windows
description: The Windows implementation of zikzak_inappwebview.
version: 6.3.1
homepage: https://github.com/arrrrny/zikzak_inappwebview

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: zikzak_inappwebview
    platforms:
      windows:
        dartPluginClass: ZikzakInAppWebViewWindows
        fileName: zikzak_inappwebview_windows.dart

dependencies:
  flutter:
    sdk: flutter
  zikzak_inappwebview_platform_interface: ^6.3.1
  webview_windows: ^0.4.0
  path: ^1.9.0
  path_provider: ^2.1.0
  # Standalone Material design system (issue #392): the windows facade renders
  # a Material spinner on top of the core widgets while the WebView2 backend
  # initializes. pkg:material_ui is the decoupled home of the framework's
  # material library, which is frozen in Flutter and will be removed.
  material_ui: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


dependency_overrides:
  zikzak_inappwebview_platform_interface:
    path: ../zikzak_inappwebview_platform_interface
