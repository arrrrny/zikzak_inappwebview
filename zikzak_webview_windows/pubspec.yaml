name: zikzak_webview_windows
description: WebView2-powered webview implementation for Windows, with the DevTools protocol API. A rename of webview_windows 0.4.0 plus jnschulze/flutter-webview-windows#334.
version: 0.5.0
homepage: https://github.com/arrrrny/zikzak_inappwebview/tree/master/zikzak_webview_windows
repository: https://github.com/arrrrny/zikzak_inappwebview
issue_tracker: https://github.com/arrrrny/zikzak_inappwebview/issues

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: ZikzakWebviewWindowsPlugin