name: zikzak_inappwebview_platform_interface
description: A common platform interface for the zikzak_inappwebview plugin.
version: 4.8.0
homepage: https://inappwebview.dev/
repository: https://github.com/arrrrny/zikzak_inappwebview/tree/master/zikzak_inappwebview_platform_interface
issue_tracker: https://github.com/arrrrny/zikzak_inappwebview/issues
topics:
  - html
  - webview
  - webview-flutter
  - inappwebview
  - browser

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.38.6"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  zikzak_inappwebview_internal_annotations: ^4.8.0

  json_annotation: ^4.12.0
  # Zorphy entities (migration from @ExchangeableObject codegen; see PROGRESS.md).
  # Declared as a version constraint (publishable); the local box path is wired
  # via dependency_overrides below — swap to the published zorphy_annotation/
  # zorphy once 2.x is released on pub.dev (then drop the override).
  zorphy_annotation: ^2.2.0

  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  zorphy: ^2.2.0

dependency_overrides:
  zorphy_annotation:
    path: /workspace/zorphy/zorphy_annotation
  zorphy:
    path: /workspace/zorphy/zorphy
  # zuraffa#279: zorphy's build-time analyzer requires meta >=1.18 while the
  # bundled Flutter pins meta 1.17.0 — the framework's own wiring (zuraffa
  # module scaffold / zuraffa_flutter pubspec) overrides both. meta is a
  # pure-annotations package; safe to bump.
  analyzer: ^13.1.0
  meta: ^1.19.0

