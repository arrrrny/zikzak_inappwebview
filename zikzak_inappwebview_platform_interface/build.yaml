targets:
  $default:
    sources:
      exclude:
        - example/**.dart
    builders:
      # Zorphy entity generation — scoped to the zfa-managed entity dir so the
      # remaining @ExchangeableObject sources (still generated by
      # dev_packages/generators during local dev) are not regenerated here.
      zorphy:zorphy:
        enabled: true
        generate_for:
          - lib/src/domain/entities/**
      json_serializable:json_serializable:
        enabled: true
        generate_for:
          - lib/src/domain/entities/**
