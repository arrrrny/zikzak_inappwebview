name: zikzak_inappwebview_module
description: >-
  Value-add module for zikzak_inappwebview — pool, capture, VCR,
  dialogue dismisser, recipes, navigation tracker, and agent tools.
  Consumes only the plugin core's public API.
version: 0.0.1-dev
publish_to: none

environment:
  # Aligned with the publishable fleet's floors (#393): this package consumes
  # the umbrella via a path dependency, so its real floor is the umbrella's.
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  zikzak_inappwebview:
    path: ../zikzak_inappwebview

# zuraffa dependencies — uncomment when zuraffa#389 ships:
#  zuraffa:
#    path: ../../zuraffa

#  dart_web_scraper:
#    git:
#      url: https://github.com/arrrrny/dart_web_scraper.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
