name: zikzak_inappwebview_module
description: >-
  Value-add module for zikzak_inappwebview — pool, capture, VCR,
  dialogue dismisser, recipes, navigation tracker, and agent tools.
  Consumes only the plugin core's public API.
version: 0.0.1-dev
publish_to: none

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  zikzak_inappwebview:
    path: ../zikzak_inappwebview

dependency_overrides:
  # Dev-only resolution against sibling checkouts. This module is never
  # published (publish_to: none), so the path overrides never reach a
  # standalone consumer; `scripts/prepare_for_publish.sh` does not cover this
  # package either. Anyone resolving this pubspec outside the monorepo layout
  # will fail — that is by design for this dev-only tier.
  zikzak_inappwebview_platform_interface:
    path: ../zikzak_inappwebview_platform_interface

# zuraffa dependencies — uncomment when zuraffa#389 ships:
#  zuraffa:
#    path: ../../zuraffa

#  dart_web_scraper:
#    git:
#      url: https://github.com/arrrrny/dart_web_scraper.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
