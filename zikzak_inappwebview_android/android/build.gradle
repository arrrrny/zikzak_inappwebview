group 'wtf.zikzak.zikzak_inappwebview_android'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // AGP 8.13.1 — current stable 8.x (matches webview_flutter_android reference).
        // 16KB page size alignment is enabled automatically (requires AGP >= 8.5.1).
        // This ensures compatibility with Android 15+ devices using 16KB memory pages.
        // See #70 for the planned AGP 9.0 / built-in Kotlin migration.
        classpath 'com.android.tools.build:gradle:8.13.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'wtf.zikzak.zikzak_inappwebview_android'
    }
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 24  // Android 7.0 (Nougat)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables.useSupportLibrary = true
        consumerProguardFiles 'proguard-rules.pro'
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    dependencies {
        implementation 'androidx.webkit:webkit:1.15.0'
        implementation 'androidx.browser:browser:1.8.0'
        implementation 'androidx.appcompat:appcompat:1.7.0'
        implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    }
}
