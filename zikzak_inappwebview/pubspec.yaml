name: zikzak_inappwebview
description: A Flutter plugin that allows you to add an inline webview, to use an headless webview, and to open an in-app browser window.
version: 6.3.0
homepage: https://arrrrny.github.io/zikzak_inappwebview
repository: https://github.com/arrrrny/zikzak_inappwebview
issue_tracker: https://github.com/arrrrny/zikzak_inappwebview/issues
topics:
  - html
  - webview
  - webview-flutter
  - inappwebview
  - browser

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.38.6"

dependencies:
  flutter:
    sdk: flutter
  zikzak_inappwebview_platform_interface: ^6.3.0
  zikzak_inappwebview_android: ^6.3.0
  zikzak_inappwebview_ios: ^6.3.0
  zikzak_inappwebview_macos: ^6.3.0
  zikzak_inappwebview_web: ^6.3.0
  zikzak_inappwebview_windows: ^6.3.0
  zikzak_inappwebview_linux: ^6.3.0
  synchronized: ^3.4.1
  # The cap at "<1.2.0" that shipped with 6.2.1 is lifted: it existed only
  # because zuraffa 7.x's CLI subtree (lib/src/cli/zfa_executable.dart,
  # reachable from the public barrel) used 64-bit integer literals that fail
  # dart2js in every Flutter Web build (arrrrny/zuraffa#1729). That issue is
  # closed and the fix shipped in zuraffa 7.2.0, where the digest helper is
  # BigInt-based. A consumer dart2js build over `package:zuraffa/zuraffa.dart`
  # + `package:zuraffa_session/zuraffa_session.dart` was re-verified against
  # zuraffa 7.2.0 / zuraffa_session 1.2.1 and compiles cleanly.
  # The old cap was also a plain version-solving hazard: 1.1.x requires
  # `zuraffa: ^6.2.2`, so any app that also needs `zuraffa: ^7.x` could not
  # resolve this package at all (6.2.1 was unreachable for zuraffa-7 apps).
  # 1.1.0 and 1.2.x carry identical session code; only the `zuraffa` range
  # differs, so widening is safe.
  zuraffa_session: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        default_package: zikzak_inappwebview_android
      ios:
        default_package: zikzak_inappwebview_ios
      macos:
        default_package: zikzak_inappwebview_macos
      web:
        default_package: zikzak_inappwebview_web
      windows:
        default_package: zikzak_inappwebview_windows
      linux:
        default_package: zikzak_inappwebview_linux

  assets:
    - packages/zikzak_inappwebview/assets/t_rex_runner/t-rex.html
    - packages/zikzak_inappwebview/assets/t_rex_runner/t-rex.css
  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.io/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.io/assets-and-images/#resolution-aware.

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.io/custom-fonts/#from-packages

false_secrets:
  - /test_node_server/*.pem
  - /test_node_server/*.pfx

# DEV ONLY: resolve intra-repo packages from local source so a single
# checkout builds against itself. Stripped by scripts/prepare_for_publish.sh
# before publishing — pub.dev rejects dependency_overrides.

