name: zikzak_inappwebview
description: A Flutter plugin that allows you to add an inline webview, to use an headless webview, and to open an in-app browser window.
version: 6.2.0
homepage: https://arrrrny.github.io/zikzak_inappwebview
repository: https://github.com/arrrrny/zikzak_inappwebview
issue_tracker: https://github.com/arrrrny/zikzak_inappwebview/issues
topics:
  - html
  - webview
  - webview-flutter
  - inappwebview
  - browser

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.38.6"

dependencies:
  flutter:
    sdk: flutter
  zikzak_inappwebview_platform_interface: ^6.2.0
  zikzak_inappwebview_android: ^6.2.0
  zikzak_inappwebview_ios: ^6.2.0
  zikzak_inappwebview_macos: ^6.2.0
  zikzak_inappwebview_web: ^6.2.0
  zikzak_inappwebview_windows: ^6.2.0
  zikzak_inappwebview_linux: ^6.2.0
  synchronized: ^3.4.1
  # Held below 1.2.0 on purpose (#363): 1.2.0 only widens its `zuraffa`
  # constraint to ^7.0.1, and zuraffa 7.x's CLI subtree
  # (lib/src/cli/zfa_executable.dart, reachable from the public barrel) uses
  # 64-bit integer literals that fail dart2js in every Flutter Web build.
  # Both session releases carry identical code, so holding the older one costs
  # nothing; lift the cap once zuraffa ships a web-safe release
  # (arrrrny/zuraffa#1729).
  zuraffa_session: ">=1.1.0 <1.2.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        default_package: zikzak_inappwebview_android
      ios:
        default_package: zikzak_inappwebview_ios
      macos:
        default_package: zikzak_inappwebview_macos
      web:
        default_package: zikzak_inappwebview_web
      windows:
        default_package: zikzak_inappwebview_windows
      linux:
        default_package: zikzak_inappwebview_linux

  assets:
    - packages/zikzak_inappwebview/assets/t_rex_runner/t-rex.html
    - packages/zikzak_inappwebview/assets/t_rex_runner/t-rex.css
  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.io/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.io/assets-and-images/#resolution-aware.

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.io/custom-fonts/#from-packages

false_secrets:
  - /test_node_server/*.pem
  - /test_node_server/*.pfx

# DEV ONLY: resolve intra-repo packages from local source so a single
# checkout builds against itself. Stripped by scripts/prepare_for_publish.sh
# before publishing — pub.dev rejects dependency_overrides.
dependency_overrides:
  zikzak_inappwebview_platform_interface:
    path: ../zikzak_inappwebview_platform_interface
  zikzak_inappwebview_android:
    path: ../zikzak_inappwebview_android
  zikzak_inappwebview_ios:
    path: ../zikzak_inappwebview_ios
  zikzak_inappwebview_macos:
    path: ../zikzak_inappwebview_macos
  zikzak_inappwebview_web:
    path: ../zikzak_inappwebview_web
  zikzak_inappwebview_windows:
    path: ../zikzak_inappwebview_windows
  zikzak_inappwebview_linux:
    path: ../zikzak_inappwebview_linux
