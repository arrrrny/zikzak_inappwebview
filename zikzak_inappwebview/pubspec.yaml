name: zikzak_inappwebview
description: A Flutter plugin that allows you to add an inline webview, to use an headless webview, and to open an in-app browser window.
version: 6.3.1
homepage: https://arrrrny.github.io/zikzak_inappwebview
repository: https://github.com/arrrrny/zikzak_inappwebview
issue_tracker: https://github.com/arrrrny/zikzak_inappwebview/issues
topics:
  - html
  - webview
  - webview-flutter
  - inappwebview
  - browser

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  zikzak_inappwebview_platform_interface: ^6.3.1
  zikzak_inappwebview_android: ^6.3.1
  zikzak_inappwebview_ios: ^6.3.1
  zikzak_inappwebview_macos: ^6.3.1
  zikzak_inappwebview_web: ^6.3.1
  zikzak_inappwebview_windows: ^6.3.1
  zikzak_inappwebview_linux: ^6.3.1
  synchronized: ^3.4.1
  # Floor 1.2.1 is the first zuraffa_session on the zuraffa-7 line: it removes
  # the last path where a consumer's graph could still land on zuraffa 6.x,
  # whose nocterm dependency drags in `equatable ^2` (breaking equatable ^3
  # apps on any Flutter) and an `analyzer`/`meta` pair no Flutter <=3.44
  # release can satisfy (#393). The open top admits the fleet realignment:
  # zuraffa_session 7.3.0 (published 2026-10-29) is dep-identical to 1.2.1
  # except `zuraffa: ^7.0.1` -> `^7.3.0`, and 1.1.0/1.2.x/7.3.0 all carry the
  # same session code, so the range stays wide. The floor also means the
  # package now requires Flutter >=3.47.0 in practice: every zuraffa 7.x needs
  # `meta ^1.19.0` and Flutter pins `meta` exactly up to 3.44.x, so the floor
  # declared above IS the real minimum (the resolve-floor CI job pins it).
  # History: 6.2.1 capped this at "<1.2.0" because zuraffa 7.x's CLI subtree
  # used 64-bit integer literals that fail dart2js in every Flutter Web build
  # (arrrrny/zuraffa#1729); fixed in zuraffa 7.2.0 (BigInt-based digest), and
  # a consumer dart2js build over `package:zuraffa/zuraffa.dart` +
  # `package:zuraffa_session/zuraffa_session.dart` compiles cleanly.
  zuraffa_session: ">=1.2.1 <8.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        default_package: zikzak_inappwebview_android
      ios:
        default_package: zikzak_inappwebview_ios
      macos:
        default_package: zikzak_inappwebview_macos
      web:
        default_package: zikzak_inappwebview_web
      windows:
        default_package: zikzak_inappwebview_windows
      linux:
        default_package: zikzak_inappwebview_linux

  assets:
    - packages/zikzak_inappwebview/assets/t_rex_runner/t-rex.html
    - packages/zikzak_inappwebview/assets/t_rex_runner/t-rex.css
  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.io/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.io/assets-and-images/#resolution-aware.

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.io/custom-fonts/#from-packages

false_secrets:
  - /test_node_server/*.pem
  - /test_node_server/*.pfx


dependency_overrides:
  zikzak_inappwebview_platform_interface:
    path: ../zikzak_inappwebview_platform_interface
  zikzak_inappwebview_android:
    path: ../zikzak_inappwebview_android
  zikzak_inappwebview_ios:
    path: ../zikzak_inappwebview_ios
  zikzak_inappwebview_macos:
    path: ../zikzak_inappwebview_macos
  zikzak_inappwebview_web:
    path: ../zikzak_inappwebview_web
  zikzak_inappwebview_windows:
    path: ../zikzak_inappwebview_windows
  zikzak_inappwebview_linux:
    path: ../zikzak_inappwebview_linux
